apply plugin: 'com.android.application'

/* 固定签名：从仓库根目录的 keystore.properties 读（CI 里由 Secrets 生成，本地可自己建）。
   文件不存在时退回 Android 默认的 debug 签名，不影响本地开发。 */
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def hasStableKey = keystorePropsFile.exists() && keystoreProps['storeFile']

/* 版本号只有一个来源：仓库根目录的 package.json。
   以前这里是写死的 versionCode 10 / versionName "1.3.4"，
   网页已经 1.3.6 了，APK 还是 1.3.4 —— 同版本号装新包，
   安卓直接报「应用未安装」。

   优先级：-PappVersionName/-PappVersionCode（CI 从 tag 传）
           > package.json
   versionCode 用 major*10000 + minor*100 + patch，单调递增。 */
def pkgVersion = "1.0.0"
try {
    def pkgFile = rootProject.file('../package.json')
    if (pkgFile.exists()) {
        def parsed = new groovy.json.JsonSlurper().parse(pkgFile)
        if (parsed.version) pkgVersion = parsed.version.toString()
    }
} catch (Exception e) {
    logger.warn("读取 package.json 版本失败，回退 ${pkgVersion}: ${e.message}")
}

def versionParts = pkgVersion.replaceAll(/^v/i, '').tokenize('.')
def vMajor = versionParts.size() > 0 ? versionParts[0].toInteger() : 1
def vMinor = versionParts.size() > 1 ? versionParts[1].toInteger() : 0
def vPatch = versionParts.size() > 2 ? versionParts[2].toInteger() : 0
def derivedCode = vMajor * 10000 + vMinor * 100 + vPatch

def appVersionName = project.hasProperty('appVersionName') ? project.property('appVersionName').toString() : pkgVersion.replaceAll(/^v/i, '')
def appVersionCode = project.hasProperty('appVersionCode') ? project.property('appVersionCode').toString().toInteger() : derivedCode

android {
    namespace = "com.keyapp.chat"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.keyapp.chat"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    signingConfigs {
        stable {
            if (hasStableKey) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
                /* CI 恢复出来的 .keystore 实际是 PKCS12，显式声明避免被当 JKS 读 */
                storeType 'PKCS12'
            }
        }
    }

    buildTypes {
        debug {
            /* debug 包也用同一把密钥签，这样 debug 与 release 可以互相覆盖升级 */
            if (hasStableKey) {
                signingConfig signingConfigs.stable
            }
        }
        release {
            if (hasStableKey) {
                signingConfig signingConfigs.stable
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
