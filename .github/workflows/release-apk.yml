name: Release APK

# 打 v* 标签时出签名后的 release APK，并挂到 Release 页面。
#   git tag v1.1.0 && git push origin v1.1.0
#
# 签名需要 4 个仓库 Secrets（Settings → Secrets and variables → Actions）：
#   KEYSTORE_BASE64    keystore 文件转成的 base64
#   KEYSTORE_PASSWORD  密钥库口令
#   KEY_ALIAS          密钥别名
#   KEY_PASSWORD       密钥口令
#
# 没有配 Secrets 时会退回出未签名的 release 包，不阻断流程。

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 取代码
        uses: actions/checkout@v5

      - name: 装 JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: 装 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 装依赖
        run: bun install

      - name: 同步前端到 www 并灌进原生工程
        run: bun run sync

      - name: 配置 Android SDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKM=$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" --install "platform-tools" "platforms;android-36" 2>&1 | tail -3 || true
          echo "sdk.dir=$SDK" > android/local.properties

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: 还原签名密钥
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/keyapp-release.keystore
          ls -l android/keyapp-release.keystore

      - name: 写入签名配置
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cat > android/keystore.properties <<EOF
          storeFile=keyapp-release.keystore
          storePassword=${KEYSTORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          EOF

      - name: 打开签名的构建配置
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path('android/app/build.gradle')
          s = p.read_text()

          # 读 keystore.properties
          if 'keystore.properties' not in s:
              s = s.replace(
                  "apply plugin: 'com.android.application'",
                  "apply plugin: 'com.android.application'\n\n"
                  "def keystorePropsFile = rootProject.file('keystore.properties')\n"
                  "def keystoreProps = new Properties()\n"
                  "if (keystorePropsFile.exists()) { keystorePropsFile.withInputStream { keystoreProps.load(it) } }\n"
              )

          # 声明 signingConfigs
          if 'signingConfigs' not in s:
              s = s.replace(
                  '    buildTypes {',
                  "    signingConfigs {\n"
                  "        release {\n"
                  "            if (keystorePropsFile.exists()) {\n"
                  "                storeFile rootProject.file(keystoreProps['storeFile'])\n"
                  "                storePassword keystoreProps['storePassword']\n"
                  "                keyAlias keystoreProps['keyAlias']\n"
                  "                keyPassword keystoreProps['keyPassword']\n"
                  "            }\n"
                  "        }\n"
                  "    }\n"
                  "    buildTypes {"
              )

          # release 用上签名
          s = re.sub(r'release\s*\{\s*\n(\s*)minifyEnabled false',
                     lambda m: 'release {\n' + m.group(1) + "if (keystorePropsFile.exists()) { signingConfig signingConfigs.release }\n" + m.group(1) + 'minifyEnabled false',
                     s, count=1)
          p.write_text(s)
          print(s[:1200])
          PY

      - name: 编译 release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: 重命名产物
        run: |
          mkdir -p out
          V="${GITHUB_REF_NAME#v}"
          for f in android/app/build/outputs/apk/release/*.apk; do
            [ -e "$f" ] || continue
            cp "$f" "out/keyapp-${V}.apk"
          done
          # 每个产物一个独立的 .sha256 旁文件（命名 <文件名>.sha256）。
          # 客户端在没有 digest 时会去拉它。不要用单个 checksums.txt：
          # 两个 job 各上传一份会同名互相覆盖。
          ( cd out && for f in ./*.apk; do [ -e "$f" ] && sha256sum "$f" > "$f.sha256"; done )
          ls -lh out

      - name: 挂到 Release
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
          body: |
            钥匙 · 自带 API Key 的 AI 对话客户端

            下载 APK 传到手机安装（需允许「安装未知来源应用」）。

            - 密钥用系统钥匙串加密存储
            - 支持中英文界面
            - 智谱、混元等不返回跨域头的服务商已可在 App 内使用

  # 电脑端 exe。必须挂在同一个 Release 下，应用内更新才找得到。
  #
  # needs: release —— 让 APK 先上传。这不是为了速度，是为了顺序：
  # 老版本（≤1.3.6）的安卓端取的是 assets[0]，不按扩展名挑。
  # 如果 exe 排在前面，那些手机点更新会下到一个 exe。串行跑保证
  # APK 是第一个 asset。
  windows:
    needs: release
    runs-on: windows-latest
    steps:
      - name: 取代码
        uses: actions/checkout@v5

      - name: 装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 装 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 装依赖
        run: |
          bun install --frozen-lockfile || bun install
          python -m pip install --upgrade pip
          python -m pip install pywebview pyinstaller pythonnet clr-loader

      - name: 构建前端 + 内嵌资源 + 打包
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: '1'
        run: |
          bun run build
          python desktop/embed_assets.py
          python desktop/check_docs.py
          python desktop/build_exe.py

      - name: 校验版本号
        shell: bash
        env:
          PYTHONUTF8: '1'
        run: |
          # 必须显式 utf-8：windows runner 的默认编码是 cp1252，
          # package.json 里有中文，不带 encoding 会 UnicodeDecodeError
          V=$(python -c "import json,io;print(json.load(io.open('package.json',encoding='utf-8'))['version'])")
          echo "package.json = $V / tag = ${GITHUB_REF_NAME}"
          if [ "v$V" != "${GITHUB_REF_NAME}" ]; then
            echo "::warning::tag 与 package.json 版本不一致，请先改 package.json"
          fi

      - name: 重命名为 ASCII 文件名
        shell: bash
        run: |
          # 中文文件名上传后会被 GitHub 压成 default.exe，且排到 assets[0]，
          # 老版本安卓端取 assets[0] 就会下到 exe。统一用 ASCII 名，
          # 并让 APK（keyapp-<ver>.apk）在名称排序上排在 exe 之前。
          V="${GITHUB_REF_NAME#v}"
          mkdir -p out
          cp "desktop/dist/钥匙.exe" "out/keyapp-desktop-${V}.exe"
          ( cd out && for f in ./*.exe; do [ -e "$f" ] && sha256sum "$f" > "$f.sha256"; done )
          ls -lh out

      - name: 清理 Release 里的过期资产
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 同一个 tag 重跑时，改过名字的旧产物会残留在 release 里，
          # 而且会因名称排序抢占 assets[0]（老客户端取第 0 个）。
          # 这里只保留本次期望的四个文件。
          V="${GITHUB_REF_NAME#v}"
          KEEP="keyapp-${V}.apk keyapp-${V}.apk.sha256 keyapp-desktop-${V}.exe keyapp-desktop-${V}.exe.sha256"
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          IDS=$(curl -s -H "Authorization: Bearer $GH_TOKEN" "$API/releases/tags/${GITHUB_REF_NAME}" \
            | python -c "import json,sys; d=json.load(sys.stdin); [print(a['id'], a['name']) for a in d.get('assets', [])]")
          echo "$IDS" | while read -r AID ANAME; do
            [ -z "$AID" ] && continue
            if ! echo " $KEEP " | grep -q " $ANAME "; then
              echo "  删除过期资产: $ANAME"
              curl -s -o /dev/null -X DELETE -H "Authorization: Bearer $GH_TOKEN" "$API/releases/assets/$AID"
            fi
          done
          echo "清理完成"

      - name: 挂到 Release
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
