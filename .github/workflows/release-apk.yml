name: Release APK

# 打 v* 标签时出包并挂到 Release，方便直接下载安装。
#   git tag v1.0.0 && git push origin v1.0.0

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 取代码
        uses: actions/checkout@v5

      - name: 装 JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: 装 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 装依赖
        run: bun install

      - name: 同步前端到 www 并灌进原生工程
        run: bun run sync

      - name: 配置 Android SDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKM=$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" --install "platform-tools" "platforms;android-36" 2>&1 | tail -3 || true
          echo "sdk.dir=$SDK" > android/local.properties

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: 编译 release APK（未签名）
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: 重命名产物
        run: |
          mkdir -p out
          for f in android/app/build/outputs/apk/release/*.apk; do
            [ -e "$f" ] || continue
            cp "$f" "out/keyapp-${GITHUB_REF_NAME}-$(basename "$f")"
          done
          ls -lh out

      - name: 挂到 Release
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true
          body: |
            钥匙 · 自带 API Key 的 AI 对话客户端

            下载下面的 APK 传到手机安装（需要允许「安装未知来源应用」）。
            这是未签名的 release 包；装不上就用 Build APK 流程出的 debug 包。
