name: Build APK

# 日常出包：推到 main / master 且改到前端或原生工程时自动编译。
# 只改 README、.gitignore 这类文件不会触发，省编译额度。
# 也可以手动 Actions → Run workflow。

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'icon.svg'
      - 'build.mjs'
      - 'capacitor.config.json'
      - 'package.json'
      - 'android/**'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 取代码
        uses: actions/checkout@v5

      - name: 装 JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: 装 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 装依赖
        run: bun install

      - name: 同步前端到 www 并灌进原生工程
        run: bun run sync

      # runner 镜像自带 Android SDK，不需要再装；只补缺失的 platform / build-tools
      - name: 配置 Android SDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKM=$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "sdkmanager = $SDKM"
          "$SDKM" --version
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" --install "platform-tools" "platforms;android-36" 2>&1 | tail -3 || true
          echo "sdk.dir=$SDK" > android/local.properties
          echo "已安装组件："
          "$SDKM" --list_installed 2>/dev/null | head -20

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: 编译 debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 显示产物
        run: ls -lh android/app/build/outputs/apk/debug/

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: keyapp-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
