name: Make Keystore (一次性)

# 只在第一次配置签名时运行一次。
#
# ⚠️ 千万不要重复运行：每次运行都会生成一把全新的密钥，覆盖之后
#    已经安装的 App 就再也无法用新包更新（签名不一致）。
#
# 运行后会产出一个 artifact（含 base64 的 keystore），
# 下载后填进仓库 Secrets：KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD

on:
  workflow_dispatch:
    inputs:
      storePassword:
        description: '密钥库口令（自己生成一串随机字符）'
        required: true
      keyAlias:
        description: '密钥别名'
        required: true
        default: 'keyapp'
      keyPassword:
        description: '密钥口令（可以和上面相同）'
        required: true

permissions:
  contents: read

jobs:
  make:
    runs-on: ubuntu-latest
    steps:
      - name: 装 JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: 生成 keystore（RSA 2048 / 10000 天）
        env:
          STORE_PW: ${{ inputs.storePassword }}
          ALIAS: ${{ inputs.keyAlias }}
          KEY_PW: ${{ inputs.keyPassword }}
        run: |
          set -e
          keytool -genkeypair -v \
            -keystore keyapp-release.keystore \
            -alias "$ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storetype PKCS12 \
            -storepass "$STORE_PW" \
            -keypass "$KEY_PW" \
            -dname "CN=keyapp, OU=personal, O=keyapp, L=, ST=, C=CN"
          echo "--- 生成成功，证书信息 ---"
          keytool -list -v -keystore keyapp-release.keystore \
            -storepass "$STORE_PW" -alias "$ALIAS" \
            | grep -E "Alias|Valid|SHA256|Signature algorithm" || true
          echo "--- 只输出指纹，不输出任何口令 ---"

      - name: 打包成 artifact
        run: |
          mkdir -p out
          base64 -w0 keyapp-release.keystore > out/keystore.base64.txt
          keytool -exportcert -rfc -keystore keyapp-release.keystore \
            -storepass "${{ inputs.storePassword }}" -alias "${{ inputs.keyAlias }}" \
            > out/cert.pem 2>/dev/null || true
          openssl x509 -in out/cert.pem -noout -fingerprint -sha256 > out/fingerprint.txt 2>/dev/null || true
          cat out/fingerprint.txt || true
          ls -lh out

      - name: 上传
        uses: actions/upload-artifact@v4
        with:
          name: keystore
          path: out/
          retention-days: 1
